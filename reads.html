<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recent Reads — Elliot Crooks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000d1a'/><text y='72' x='50' text-anchor='middle' font-size='54' font-family='serif' fill='%23940000' font-weight='bold'>EC</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cr:#940000;--pr:#003049;--space:#000d1a;--st:#669bbc;--iv:#F5F0E8;--sa:#C9B99A;
  --fd:'Libre Baskerville',serif;--fb:'Cormorant Garamond',serif;--fm:'DM Mono',monospace;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--space);color:var(--iv);font-family:var(--fb);min-height:100vh}

/* CURSOR */
#cur,#curR{display:none}
@media(pointer:fine){
  body{cursor:none}a,button{cursor:none}
  #cur{display:block;position:fixed;width:7px;height:7px;background:var(--cr);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
  #curR{display:block;position:fixed;width:30px;height:30px;border:1px solid rgba(102,155,188,.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .25s,height .25s,border-color .25s}
  #curR.h{width:48px;height:48px;border-color:var(--cr)}
}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:1.4rem 3.5rem;background:rgba(0,13,26,.92);backdrop-filter:blur(14px)}
.nlogo{font-family:var(--fm);font-size:.63rem;letter-spacing:.2em;text-transform:uppercase;color:var(--iv);text-decoration:none;opacity:.7}
.nback{font-family:var(--fm);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--st);text-decoration:none;opacity:.6;transition:opacity .2s;display:flex;align-items:center;gap:.6rem}
.nback:hover{opacity:1}
.nback::before{content:'←'}

/* ADMIN LOGIN PANEL */
#admin-panel{position:fixed;top:0;right:0;bottom:0;width:480px;background:rgba(0,13,26,.98);border-left:1px solid rgba(245,240,232,.06);z-index:150;transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);overflow-y:auto;padding:7rem 3rem 3rem}
#admin-panel.open{transform:none}
.panel-title{font-family:var(--fd);font-size:1.8rem;font-weight:700;color:var(--iv);line-height:1;letter-spacing:-.03em;margin-bottom:.5rem}
.panel-sub{font-family:var(--fm);font-size:.52rem;letter-spacing:.15em;text-transform:uppercase;color:var(--st);opacity:.6;margin-bottom:2.5rem}

/* LOGIN FORM */
#login-form{display:flex;flex-direction:column;gap:1.2rem}
.field-label{font-family:var(--fm);font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--iv);opacity:.45;margin-bottom:.4rem;display:block}
.field-input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(245,240,232,.15);padding:.6rem 0;font-family:var(--fm);font-size:.85rem;color:var(--iv);outline:none;transition:border-color .2s;letter-spacing:.04em}
.field-input:focus{border-color:var(--cr)}
.field-input::placeholder{color:rgba(245,240,232,.2);font-size:.6rem;letter-spacing:.1em}
textarea.field-input{resize:vertical;min-height:80px;line-height:1.6;font-size:.82rem}
.btn-primary{font-family:var(--fm);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;background:var(--cr);color:var(--iv);border:none;padding:.7rem 1.6rem;cursor:pointer;transition:opacity .2s;margin-top:.5rem;align-self:flex-start}
.btn-primary:hover{opacity:.8}
.btn-secondary{font-family:var(--fm);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;background:transparent;color:var(--iv);border:1px solid rgba(245,240,232,.15);padding:.55rem 1.2rem;cursor:pointer;transition:border-color .2s,color .2s;align-self:flex-start}
.btn-secondary:hover{border-color:var(--cr);color:var(--cr)}
.login-err{font-family:var(--fm);font-size:.48rem;letter-spacing:.1em;color:var(--cr);display:none;margin-top:.3rem}
.login-err.show{display:block}

/* TYPE TABS */
.type-tabs{display:flex;gap:0;margin-bottom:1.5rem;border:1px solid rgba(245,240,232,.1)}
.type-tab{font-family:var(--fm);font-size:.48rem;letter-spacing:.14em;text-transform:uppercase;padding:.5rem .9rem;background:transparent;border:none;color:var(--iv);opacity:.4;cursor:pointer;transition:opacity .2s,background .2s;flex:1;text-align:center}
.type-tab.active{opacity:1;background:rgba(148,0,0,.25);color:var(--cr)}

/* DIVIDER */
.panel-divider{height:1px;background:rgba(245,240,232,.07);margin:2rem 0}

/* ADD ENTRY FORM */
#add-form{display:flex;flex-direction:column;gap:1.2rem}
#add-form.hidden{display:none}
.logged-in-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.logged-as{font-family:var(--fm);font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:var(--st);opacity:.7}

/* ADMIN TOGGLE BTN */
#admin-toggle{position:fixed;bottom:2rem;right:2rem;z-index:160;font-family:var(--fm);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,13,26,.9);color:var(--iv);border:1px solid rgba(245,240,232,.12);padding:.6rem 1rem;cursor:pointer;transition:border-color .2s,color .2s;backdrop-filter:blur(8px)}
#admin-toggle:hover{border-color:var(--cr);color:var(--cr)}
#admin-toggle.active{border-color:var(--cr);color:var(--cr)}

/* HERO */
.reads-hero{padding:10rem 4rem 4rem;position:relative;border-bottom:1px solid rgba(245,240,232,.06)}
.reads-eyebrow{font-family:var(--fm);font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--st);margin-bottom:1.5rem;display:flex;align-items:center;gap:1rem;opacity:.7}
.reads-eyebrow::before{content:'';display:inline-block;width:2rem;height:1px;background:var(--cr)}
.reads-title{font-family:var(--fd);font-size:clamp(3rem,7vw,6.5rem);font-weight:700;color:var(--iv);line-height:.9;letter-spacing:-.04em;margin-bottom:1.5rem}
.reads-title em{font-style:italic;color:var(--st)}
.reads-desc{font-family:var(--fb);font-size:1.1rem;color:var(--iv);opacity:.42;max-width:55ch;line-height:1.78;font-style:italic}

/* FILTER BAR */
.filter-bar{padding:1.5rem 4rem;border-bottom:1px solid rgba(245,240,232,.06);display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.filter-btn{font-family:var(--fm);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;background:transparent;border:1px solid rgba(245,240,232,.12);color:var(--iv);padding:.4rem .9rem;cursor:pointer;transition:all .2s;opacity:.5}
.filter-btn:hover,.filter-btn.active{opacity:1;border-color:var(--cr);color:var(--cr)}
.filter-count{font-family:var(--fm);font-size:.45rem;letter-spacing:.1em;color:var(--iv);opacity:.25;margin-left:auto}

/* FEED */
.feed{padding:0 4rem 6rem;max-width:1000px}
.feed-empty{padding:6rem 0;font-family:var(--fd);font-size:1.3rem;font-style:italic;color:var(--iv);opacity:.25;text-align:center}

/* ENTRY CARD */
.entry{border-bottom:1px solid rgba(245,240,232,.07);padding:3rem 0;display:grid;gap:1rem;animation:fadeUp .5s ease forwards;opacity:0}
@keyframes fadeUp{to{opacity:1;transform:none}from{opacity:0;transform:translateY(12px)}}
.entry-top{display:flex;align-items:flex-start;gap:1.5rem;justify-content:space-between}
.entry-meta{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.entry-type{font-family:var(--fm);font-size:.46rem;letter-spacing:.14em;text-transform:uppercase;padding:.28rem .7rem;border:1px solid;border-radius:2px}
.entry-type.paper{color:#7ab8d4;border-color:rgba(122,184,212,.3)}
.entry-type.article{color:#c9b99a;border-color:rgba(201,185,154,.3)}
.entry-type.book{color:#d4a574;border-color:rgba(212,165,116,.3)}
.entry-type.video{color:#e07070;border-color:rgba(224,112,112,.3)}
.entry-type.podcast{color:#90c090;border-color:rgba(144,192,144,.3)}
.entry-type.music{color:#c090c0;border-color:rgba(192,144,192,.3)}
.entry-type.film{color:#d4c070;border-color:rgba(212,192,112,.3)}
.entry-type.other{color:#a0a0a0;border-color:rgba(160,160,160,.3)}
.entry-date{font-family:var(--fm);font-size:.46rem;letter-spacing:.1em;color:var(--iv);opacity:.3}
.entry-delete{font-family:var(--fm);font-size:.44rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cr);background:none;border:none;cursor:pointer;opacity:0;transition:opacity .2s;padding:.2rem .4rem}
.entry:hover .entry-delete{opacity:.5}
.entry-delete:hover{opacity:1 !important}
.entry-title{font-family:var(--fd);font-size:clamp(1.1rem,1.8vw,1.5rem);color:var(--iv);line-height:1.2;font-weight:400}
.entry-title a{color:inherit;text-decoration:none;transition:color .2s}
.entry-title a:hover{color:var(--st)}
.entry-source{font-family:var(--fm);font-size:.48rem;letter-spacing:.1em;color:var(--st);opacity:.55;word-break:break-all}
.entry-comment{font-family:var(--fb);font-size:1.05rem;color:var(--iv);opacity:.55;line-height:1.75;font-style:italic;border-left:2px solid rgba(148,0,0,.35);padding-left:1.2rem;margin-top:.3rem}

/* RESPONSIVE */
@media(max-width:768px){
  nav{padding:1rem 1.5rem}
  .reads-hero{padding:8rem 1.5rem 3rem}
  .filter-bar{padding:1.2rem 1.5rem}
  .feed{padding:0 1.5rem 4rem}
  #admin-panel{width:100%;border-left:none;border-top:1px solid rgba(245,240,232,.06)}
  .entry-top{flex-direction:column;gap:.8rem}
}
</style>
</head>
<body>
<div id="cur"></div>
<div id="curR"></div>

<nav>
  <a href="index.html" class="nback">Back</a>
  <a href="index.html" class="nlogo">Elliot Crooks</a>
</nav>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <!-- LOGIN STATE -->
  <div id="login-state">
    <div class="panel-title">Admin</div>
    <div class="panel-sub">Log in to add entries</div>
    <div id="login-form">
      <div>
        <label class="field-label">Password</label>
        <input class="field-input" type="password" id="admin-pass" placeholder="enter password" autocomplete="off">
        <div class="login-err" id="login-err">Incorrect password</div>
      </div>
      <button class="btn-primary" id="login-btn">Log In</button>
    </div>
  </div>

  <!-- LOGGED IN STATE -->
  <div id="loggedin-state" style="display:none">
    <div class="logged-in-bar">
      <div>
        <div class="panel-title">Add Entry</div>
        <div class="panel-sub">Log something you read or watched</div>
      </div>
      <button class="btn-secondary" id="logout-btn">Log out</button>
    </div>

    <div id="add-form">
      <!-- TYPE SELECTOR -->
      <div>
        <label class="field-label">Type</label>
        <div class="type-tabs">
          <button class="type-tab active" data-type="paper">Paper</button>
          <button class="type-tab" data-type="article">Article</button>
          <button class="type-tab" data-type="book">Book</button>
          <button class="type-tab" data-type="video">Video</button>
          <button class="type-tab" data-type="podcast">Podcast</button>
          <button class="type-tab" data-type="music">Music</button>
          <button class="type-tab" data-type="film">Film</button>
        </div>
      </div>

      <!-- URL / IDENTIFIER -->
      <div id="url-field">
        <label class="field-label">URL</label>
        <input class="field-input" type="url" id="entry-url" placeholder="https://...">
      </div>

      <!-- BOOK FIELDS (shown when type=book or film/music without URL) -->
      <div id="manual-fields" style="display:none">
        <label class="field-label">Title</label>
        <input class="field-input" id="entry-manual-title" placeholder="Title">
        <div style="height:.8rem"></div>
        <label class="field-label">Author / Artist / Director</label>
        <input class="field-input" id="entry-manual-author" placeholder="Author or creator">
      </div>

      <!-- TITLE OVERRIDE -->
      <div>
        <label class="field-label">Title <span style="opacity:.4">(auto-filled or override)</span></label>
        <input class="field-input" id="entry-title" placeholder="Title of the piece">
      </div>

      <!-- COMMENT -->
      <div>
        <label class="field-label">Your note</label>
        <textarea class="field-input" id="entry-comment" placeholder="What struck you about it..."></textarea>
      </div>

      <button class="btn-primary" id="add-btn">Add to Reads</button>
      <div class="login-err" id="add-err" style="margin-top:.2rem"></div>
    </div>
  </div>
</div>

<!-- ADMIN TOGGLE -->
<button id="admin-toggle">+ Add Entry</button>

<!-- MAIN CONTENT -->
<div class="reads-hero">
  <div class="reads-eyebrow">Curated by Elliot Crooks</div>
  <h1 class="reads-title">Recent<br><em>Reads</em></h1>
  <p class="reads-desc">Papers, essays, books, films, and other media that have caught my attention — with notes on why.</p>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="paper">Papers</button>
  <button class="filter-btn" data-filter="article">Articles</button>
  <button class="filter-btn" data-filter="book">Books</button>
  <button class="filter-btn" data-filter="video">Videos</button>
  <button class="filter-btn" data-filter="podcast">Podcasts</button>
  <button class="filter-btn" data-filter="music">Music</button>
  <button class="filter-btn" data-filter="film">Films</button>
  <span class="filter-count" id="filter-count"></span>
</div>

<div class="feed" id="feed">
  <div class="feed-empty" id="feed-empty">No entries yet.</div>
</div>

<script>
/* CURSOR */
if(matchMedia('(pointer:fine)').matches){
  const cur=document.getElementById('cur'),ring=document.getElementById('curR');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px'});
  (function aR(){rx+=(mx-rx)*.11;ry+=(my-ry)*.11;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(aR)})();
  document.querySelectorAll('a,button').forEach(el=>{
    el.addEventListener('mouseenter',()=>ring.classList.add('h'));
    el.addEventListener('mouseleave',()=>ring.classList.remove('h'));
  });
}

const PASS='elliot';
const STORE_KEY='ec_reads';
let loggedIn=false;
let currentType='paper';
let currentFilter='all';

/* STORAGE */
function getEntries(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch{return[]}}
function saveEntries(e){localStorage.setItem(STORE_KEY,JSON.stringify(e))}

/* ADMIN PANEL */
const panel=document.getElementById('admin-panel');
const toggle=document.getElementById('admin-toggle');
toggle.addEventListener('click',()=>{
  const open=panel.classList.toggle('open');
  toggle.classList.toggle('active',open);
  toggle.textContent=open?'✕ Close':'+ Add Entry';
});

/* LOGIN */
document.getElementById('login-btn').addEventListener('click',tryLogin);
document.getElementById('admin-pass').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
function tryLogin(){
  if(document.getElementById('admin-pass').value===PASS){
    loggedIn=true;
    document.getElementById('login-state').style.display='none';
    document.getElementById('loggedin-state').style.display='block';
  } else {
    const err=document.getElementById('login-err');
    err.classList.add('show');
    document.getElementById('admin-pass').value='';
    setTimeout(()=>err.classList.remove('show'),2000);
  }
}
document.getElementById('logout-btn').addEventListener('click',()=>{
  loggedIn=false;
  document.getElementById('login-state').style.display='block';
  document.getElementById('loggedin-state').style.display='none';
  document.getElementById('admin-pass').value='';
});

/* TYPE TABS */
document.querySelectorAll('.type-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.type-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentType=tab.dataset.type;
    const manualTypes=['book','film','music'];
    const urlField=document.getElementById('url-field');
    const manualFields=document.getElementById('manual-fields');
    if(manualTypes.includes(currentType)){
      manualFields.style.display='block';
      urlField.style.display=currentType==='book'?'none':'block';
    } else {
      manualFields.style.display='none';
      urlField.style.display='block';
    }
  });
});

/* ADD ENTRY */
document.getElementById('add-btn').addEventListener('click',addEntry);
function addEntry(){
  const url=document.getElementById('entry-url').value.trim();
  const manualTitle=document.getElementById('entry-manual-title').value.trim();
  const manualAuthor=document.getElementById('entry-manual-author').value.trim();
  const titleOverride=document.getElementById('entry-title').value.trim();
  const comment=document.getElementById('entry-comment').value.trim();
  const errEl=document.getElementById('add-err');

  let title=titleOverride||manualTitle;
  let source=url;

  if(!title&&!url){errEl.textContent='Please add a title or URL.';errEl.style.display='block';setTimeout(()=>errEl.style.display='none',3000);return;}
  if(!title&&url){
    // extract title from URL hostname as fallback
    try{const u=new URL(url);title=u.hostname.replace('www.','')+' — '+u.pathname.split('/').filter(Boolean).pop();}
    catch{title=url;}
  }
  if(manualAuthor) source=manualAuthor;

  const entry={
    id:Date.now(),
    type:currentType,
    title,
    url:url||null,
    source,
    comment,
    date:new Date().toISOString()
  };
  const entries=getEntries();
  entries.unshift(entry);
  saveEntries(entries);

  // reset form
  document.getElementById('entry-url').value='';
  document.getElementById('entry-manual-title').value='';
  document.getElementById('entry-manual-author').value='';
  document.getElementById('entry-title').value='';
  document.getElementById('entry-comment').value='';

  renderFeed();
  // brief confirm
  const btn=document.getElementById('add-btn');
  btn.textContent='Added ✓';btn.style.opacity='.6';
  setTimeout(()=>{btn.textContent='Add to Reads';btn.style.opacity='';},1800);
}

/* DELETE */
function deleteEntry(id){
  const entries=getEntries().filter(e=>e.id!==id);
  saveEntries(entries);renderFeed();
}

/* RENDER */
function renderFeed(){
  const entries=getEntries();
  const filtered=currentFilter==='all'?entries:entries.filter(e=>e.type===currentFilter);
  const feed=document.getElementById('feed');
  const empty=document.getElementById('feed-empty');
  const count=document.getElementById('filter-count');
  count.textContent=filtered.length+' '+(filtered.length===1?'entry':'entries');

  const existing=feed.querySelectorAll('.entry');
  existing.forEach(e=>e.remove());

  if(filtered.length===0){empty.style.display='block';return;}
  empty.style.display='none';

  filtered.forEach((e,i)=>{
    const el=document.createElement('div');
    el.className='entry';
    el.style.animationDelay=(i*.05)+'s';
    const dateStr=new Date(e.date).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
    const titleHtml=e.url
      ?`<a href="${e.url}" target="_blank" rel="noopener">${escHtml(e.title)}</a>`
      :escHtml(e.title);
    const sourceHtml=e.source?`<div class="entry-source">${escHtml(e.source)}</div>`:'';
    const commentHtml=e.comment?`<div class="entry-comment">${escHtml(e.comment)}</div>`:'';
    const deleteHtml=loggedIn?`<button class="entry-delete" onclick="deleteEntry(${e.id})">Delete</button>`:'';
    el.innerHTML=`
      <div class="entry-top">
        <div class="entry-meta">
          <span class="entry-type ${e.type}">${e.type}</span>
          <span class="entry-date">${dateStr}</span>
        </div>
        ${deleteHtml}
      </div>
      <div class="entry-title">${titleHtml}</div>
      ${sourceHtml}
      ${commentHtml}
    `;
    feed.appendChild(el);
  });
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* FILTERS */
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    renderFeed();
  });
});

renderFeed();
</script>
</body>
</html>
